name: Deploy Supabase Functions
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Sin nombre despliega todas las funciones de supabase/functions; verify_jwt sale de supabase/config.toml.
      - run: supabase functions deploy --remote=${{ secrets.SUPABASE_PROJECT_ID }} --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
